name: Automated RSS Cloud Ingestion Workflow

on:
  schedule:
    # Every 3 hours. (Used to be every 5 minutes, which is what forced the
    # old pipeline to fabricate filler articles on quiet news cycles.)
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  ingest-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Automated News Ingestion Workflow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python news_workflow_supabase.py

      - name: Regenerate SEO Pages & Sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          python generate_seo_pages.py

      - name: Commit Updated Content & Generated Pages
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: automated RSS news ingestion update [skip ci]"
          file_pattern: "articles.json articles.js articles/ sitemap.xml"
